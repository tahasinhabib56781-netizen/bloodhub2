<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloodHub - বাংলাদেশ রক্তদাতা ডিরেক্টরি</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl font-black text-rose-600">BloodHub</span>
        <span class="text-xs bg-rose-50 text-rose-700 px-2 py-0.5 rounded-full border border-rose-200 font-bold">বাংলাদেশ ডিরেক্টরি</span>
      </div>
      <div class="space-x-2">
        <a href="/area-explorer" class="px-3 py-1.5 bg-purple-50 text-purple-700 hover:bg-purple-100 rounded-lg text-xs font-semibold border border-purple-200">
          🌐 এলাকা এক্সপ্লোরার
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto p-4 w-full grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Search Form -->
    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
      <h2 class="text-base font-bold mb-4">🔍 রক্ত অনুসন্ধান</h2>
      <form id="searchForm" onsubmit="event.preventDefault(); doSearch();">
        <div class="mb-4">
          <label class="block text-xs font-bold text-gray-700 mb-1">রক্তের গ্রুপ:</label>
          <div class="grid grid-cols-4 gap-2" id="bloodGroupButtons">
            {% for bg in blood_groups %}
            <button type="button" class="py-1.5 text-xs font-bold rounded border hover:bg-gray-50 {{ 'bg-rose-600 text-white border-rose-600' if loop.first else 'border-gray-200' }}" onclick="selectGroup('{{ bg }}', this)">
              {{ bg }}
            </button>
            {% endfor %}
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-xs font-bold text-gray-700 mb-1">জেলা / উপজেলা (বাংলা বা ইংরেজি):</label>
          <input type="text" id="areaInput" value="শার্শা" class="w-full px-3 py-2 border rounded-lg text-xs font-medium focus:ring-2 focus:ring-rose-500 focus:outline-none" placeholder="যেমন: শার্শা, Sharsha">
        </div>

        <button type="submit" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition">
          অনুসন্ধান করুন
        </button>
      </form>
    </div>

    <!-- Results List -->
    <div class="md:col-span-2 bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
      <div class="flex items-center justify-between pb-3 border-b mb-4">
        <h2 class="text-base font-bold">উপযুক্ত রক্তদাতাদের তালিকা</h2>
        <span id="resultCount" class="text-xs text-gray-500 font-medium">0 জন পাওয়া গেছে</span>
      </div>
      <div id="donorsContainer" class="space-y-3">
        <!-- Results injected dynamically -->
      </div>
    </div>
  </main>

  <footer class="bg-white border-t py-3 text-center text-xs text-gray-500">
    BloodHub Bangladesh • মডুলার প্রজেক্ট আর্কিটেকচার
  </footer>

  <script>
    let currentGroup = "A+";
    function selectGroup(bg, btn) {
      currentGroup = bg;
      document.querySelectorAll("#bloodGroupButtons button").forEach(b => {
        b.className = "py-1.5 text-xs font-bold rounded border border-gray-200 hover:bg-gray-50";
      });
      btn.className = "py-1.5 text-xs font-bold rounded border bg-rose-600 text-white border-rose-600";
    }

    async function doSearch() {
      const area = document.getElementById("areaInput").value;
      const res = await fetch(`/api/search?group=${encodeURIComponent(currentGroup)}&area=${encodeURIComponent(area)}`);
      const data = await res.json();
      document.getElementById("resultCount").innerText = `${data.count} জন পাওয়া গেছে`;
      const container = document.getElementById("donorsContainer");
      if (data.donors.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-gray-400 text-xs">কোনো উপযুক্ত রক্তদাতা পাওয়া যায়নি</div>`;
        return;
      }
      container.innerHTML = data.donors.map(d => `
        <div class="p-4 border rounded-xl flex items-center justify-between hover:border-rose-300">
          <div>
            <div class="font-bold text-sm text-gray-900">${d.name} <span class="text-xs px-2 py-0.5 rounded bg-rose-100 text-rose-700 font-bold ml-2">${d.blood_group}</span></div>
            <div class="text-xs text-gray-600 mt-1">📞 ${d.phone} • 📍 ${d.address_present}</div>
          </div>
          <a href="tel:${d.phone}" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg">কল দিন</a>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
